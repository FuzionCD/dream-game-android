apply plugin: 'com.android.application'

android {
    namespace 'com.fireflame.dream'
    compileSdk 36

    defaultConfig {
        applicationId "com.fireflame.dream"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        ndk {
            // arm64-v8a   every 64-bit phone from ~2015 on, the bulk of installs
            // armeabi-v7a 32-bit ARM, for pre-2015 and budget devices still on API 21+
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                version "3.22.1"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            // uses whichever cmake version the sdk has installed
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            // sdl2 provides its own java sources, point to them
            java.srcDirs = [
                'src/main/java',
                'src/main/jni/SDL2/android-project/app/src/main/java'
            ]
        }
    }
    // NDK r27c LTS, pinned for reproducible builds.
    ndkVersion '27.2.12479018'
}
